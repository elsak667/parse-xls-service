services:
  - type: web
    name: xls-parser
    runtime: python
    repo: https://github.com/elsak667/parse-xls-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
